name: Update animated profile charts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-dashboard.yml'
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SVG charts
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/update_dashboard.py
      - name: Commit updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/language-stack.svg assets/contribution-heatmap.svg assets/github-stats.svg assets/streak-stats.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh animated profile charts'
          git push
